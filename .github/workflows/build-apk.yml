name: Build APK - Kejaksan Smart
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm install --no-package-lock
      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Patch Manifest Full Permissions Internal
        run: |
          python3 << 'ENDPYTHON'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.CAMERA" not in s:
              perms = "    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.NFC\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_BACKGROUND_LOCATION\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />"
              s = s.replace("<application", perms + "\n    <application")
              p.write_text(s)
              print("patched manifest")
          ENDPYTHON
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kejaksan-smart-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
