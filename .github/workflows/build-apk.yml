name: Build APK - Kejaksan Smart
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-package-lock
      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          ls -lh www/
      - run: if [ ! -d "android" ]; then npx cap add android; fi
      - name: Patch Manifest
        run: |
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "android.permission.CAMERA" not in s:
              perms='<uses-permission android:name="android.permission.CAMERA" />'
              s=s.replace("<application", perms+"\n    <application")
              p.write_text(s)
          PY
      - run: npx cap sync android
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kejaksan-smart-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
